<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="style.css">
    <title>Bin2Dec - Conversão entre binário e decimal</title>
</head>

<body>
    <div class="container container-sm mt-3">
        <header>
            <h1>Base Converter</h1>
            <h5>Calculadora de conversão entre bases numéricas</h5>
        </header>
        <div class="row mt-3">
            <div class="input-group input-group-lg">
                <input type="text" class="form-control" id="input-dec" autofocus />
                <span class="input-group-text">dec</span>
                <button class="btn btn-secondary" id="copy-dec">⮺</button>
            </div>
        </div>
        <div class="row mt-3">
            <div class="input-group input-group-lg">
                <input type="text" class="form-control" id="input-bin" />
                <span class="input-group-text">bin</span>
                <button class="btn btn-secondary" id="copy-bin">⮺</button>
            </div>
        </div>
        <div class="row mt-3">
            <div class="input-group input-group-lg">
                <input type="text" class="form-control" id="input-oct" />
                <span class="input-group-text">oct</span>
                <button class="btn btn-secondary" id="copy-oct">⮺</button>
            </div>
        </div>
        <div class="row mt-3">
            <div class="input-group input-group-lg">
                <input type="text" class="form-control" id="input-hex" />
                <span class="input-group-text">hex</span>
                <button class="btn btn-secondary" id="copy-hex">⮺</button>
            </div>
        </div>
    </div>
    <script src="./script.js"></script>
</body>

</html>
